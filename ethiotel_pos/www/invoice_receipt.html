{% extends "templates/web.html" %}

{% block title %}Fiscal Tax Invoice Receipt{% endblock %}

{% block style %}
<style>
:root {
	--rv-brand: #0f766e;
	--rv-brand-dark: #134e4a;
	--rv-brand-tint: #f0fdfa;
	--rv-gold: #b45309;
	--rv-gold-tint: #fffbeb;
	--rv-ink: #0f172a;
	--rv-soft: #475569;
	--rv-mute: #94a3b8;
	--rv-line: #cbd5e1;
	--rv-line-soft: #e2e8f0;
	--rv-bg: #f1f5f9;
	--rv-ok-bg: #dcfce7;
	--rv-ok-ink: #14532d;
	--rv-warn-bg: #fef3c7;
	--rv-warn-ink: #78350f;
	--rv-bad-bg: #fee2e2;
	--rv-bad-ink: #7f1d1d;
}

body { background: var(--rv-bg); }

.rv-wrap { max-width: 1080px; margin: 0 auto; padding: 18px 14px 70px; }

/* ════════════ PRINT TOOLBAR ════════════ */
/* ════════════ PRINT TOOLBAR (single line) ════════════ */
.rv-toolbar {
	background: #fff;
	border: 1px solid var(--rv-line);
	border-radius: 6px;
	margin-bottom: 12px;
}
.rv-bar {
	display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
	padding: 7px 12px;
}
.rv-bar-title {
	font-size: 11px; font-weight: 800; color: var(--rv-brand-dark);
	text-transform: uppercase; letter-spacing: .07em; white-space: nowrap;
}
.rv-sizes { display: flex; flex-wrap: wrap; gap: 5px; }
.rv-size-row {
	display: inline-flex; align-items: baseline; gap: 6px;
	padding: 5px 10px; border: 1px solid var(--rv-line); border-radius: 5px;
	background: #fff; color: var(--rv-ink); cursor: pointer;
	font-family: inherit; font-size: 12px; line-height: 1.2;
	transition: background .12s ease, border-color .12s ease;
}
.rv-size-row b { font-weight: 800; }
.rv-size-row small { font-size: 10px; color: var(--rv-mute); font-variant-numeric: tabular-nums; }
.rv-size-row:hover { background: var(--rv-brand-tint); border-color: var(--rv-brand); }
.rv-size-row.active { background: var(--rv-brand); border-color: var(--rv-brand); color: #fff; }
.rv-size-row.active small { color: rgba(255, 255, 255, .78); }

.rv-mode-label { font-size: 11px; color: var(--rv-mute); white-space: nowrap; margin-left: auto; }
.rv-actions { display: flex; gap: 6px; }
.rv-btn {
	padding: 6px 14px; border-radius: 5px; border: 1px solid var(--rv-line);
	background: #fff; color: var(--rv-ink); font-size: 12px; font-weight: 700;
	cursor: pointer; text-align: center; white-space: nowrap;
}
.rv-btn:hover { border-color: var(--rv-brand); color: var(--rv-brand); }
.rv-btn-primary { background: var(--rv-brand); border-color: var(--rv-brand); color: #fff; }
.rv-btn-primary:hover { background: var(--rv-brand-dark); color: #fff; }

/* ════════════ RECEIPT HOST / PAPER WIDTHS ════════════ */
.rv-host { display: block; }
.receipt {
	margin: 0 auto; background: #fff; color: var(--rv-ink);
	box-shadow: 0 2px 10px rgba(15, 23, 42, .1);
	-webkit-print-color-adjust: exact; print-color-adjust: exact;
}

/* Document mode widths */
.rv-host.size-a4 .receipt { max-width: 980px; padding: 20px; }
.rv-host.size-a5 .receipt { max-width: 660px; padding: 12px; }
.rv-host.size-letter .receipt { max-width: 720px; padding: 15px; }

/* Thermal mode widths */
.rv-host.size-80 .receipt { max-width: 76mm; padding: 2mm 1.5mm; }
.rv-host.size-58 .receipt { max-width: 54mm; padding: 1.5mm 1mm; }

/* ════════════ DOCUMENT MODE ════════════ */
.doc { font-family: "Segoe UI", Arial, Helvetica, sans-serif; font-size: 13px; line-height: 1.45; }
.rv-host.size-a5 .doc { font-size: 11px; }
.rv-host.size-letter .doc { font-size: 12px; }

.doc-badge {
	display: inline-block; padding: 4px 13px; border-radius: 3px;
	font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em;
}
.rv-host.size-a5 .doc-badge { font-size: 9px; padding: 3px 9px; }
.doc-badge.ok { background: var(--rv-ok-bg); color: var(--rv-ok-ink); border: 1px solid #86efac; }
.doc-badge.warn { background: var(--rv-warn-bg); color: var(--rv-warn-ink); border: 1px solid #fcd34d; }
.doc-badge.bad { background: var(--rv-bad-bg); color: var(--rv-bad-ink); border: 1px solid #fca5a5; }

table.doc-head { width: 100%; border-collapse: collapse; border: 3px dashed var(--rv-brand); }
table.doc-head td { vertical-align: middle; padding: 0 0 12px; }
.doc-logo { width: 84px; padding-right: 16px; }
.doc-logo img { width: 84px; height: auto; max-height: 72px; object-fit: contain; border: 1px solid var(--rv-line-soft); border-radius: 4px; }
.rv-host.size-a5 .doc-logo, .rv-host.size-a5 .doc-logo img { width: 60px; }
.doc-org-title { font-size: 20px; font-weight: 800; color: var(--rv-brand-dark); letter-spacing: -.01em; }
.rv-host.size-a5 .doc-org-title { font-size: 15px; }
.doc-org-sub { font-size: 12px; color: var(--rv-soft); }
.rv-host.size-a5 .doc-org-sub { font-size: 10px; }

.doc-meta { width: 300px; border: 1px solid var(--rv-line); border-radius: 4px; overflow: hidden; }
.rv-host.size-a5 .doc-meta { width: 215px; }
.doc-meta table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
.rv-host.size-a5 .doc-meta table { font-size: 10px; }
.doc-meta th {
	text-align: left; padding: 5px 10px; font-size: 9.5px; text-transform: uppercase;
	letter-spacing: .05em; color: var(--rv-mute); background: #f8fafc;
	border-bottom: 1px solid var(--rv-line-soft); width: 42%;
}
.doc-meta td { padding: 5px 10px; font-weight: 700; border-bottom: 1px solid var(--rv-line-soft); }
.doc-meta tr:last-child th, .doc-meta tr:last-child td { border-bottom: none; }

table.doc-fiscal { width: 100%; border-collapse: collapse; border-bottom: 1px solid var(--rv-line); }
table.doc-fiscal td { vertical-align: top; padding: 12px 0; }
.doc-fiscal-title { font-size: 20px; font-weight: 800; color: var(--rv-brand); line-height: 1.55; letter-spacing: -.01em; margin-bottom: 10%;}
.rv-host.size-a5 .doc-fiscal-title { font-size: 16.5px; }
.doc-fiscal-title small { display: block; font-size: 13.5px; color: var(--rv-soft); font-weight: 700; margin-top: 3px; }
.rv-host.size-a5 .doc-fiscal-title small { font-size: 11.5px; }
.doc-tag {
	display: inline-block; padding: 2px 9px; border-radius: 3px; font-size: 16px;
	font-weight: 800; background: var(--rv-brand-tint); color: var(--rv-brand-dark);
	border: 1px solid #060606;
}
.doc-tag.gold { background: var(--rv-gold-tint); color: var(--rv-gold); border-color: #fde68a; }
.doc-tag.dark { background: #0f172a; color: #fff; border-color: #0f172a; }
.doc-irn { margin-top: 7px; font-family: "Consolas", "Courier New", monospace; font-size: 10.5px; word-break: break-all; }
.rv-host.size-a5 .doc-irn { font-size: 9px; }
.doc-irn b { color: var(--rv-brand-dark); }

.doc-qr { width: 244px; text-align: center; padding-left: 14px; }
.rv-host.size-a5 .doc-qr { width: 152px; }
.rv-host.size-letter .doc-qr { width: 194px; }
.doc-qr .frame, .th-qr .frame {
	display: inline-block; padding: 10px; background: #fff;
	border: 1px dashed var(--rv-line); border-radius: 6px; line-height: 0;
	-webkit-print-color-adjust: exact; print-color-adjust: exact;
}
.doc-qr img {
	display: block; width: 220px; height: 220px; object-fit: contain;
	image-rendering: auto;
}
.rv-host.size-a5 .doc-qr img { width: 128px; height: 128px; }
.rv-host.size-letter .doc-qr img { width: 170px; height: 170px; }
.doc-qr .rv-qr-none { padding: 26px 8px; font-size: 10px; color: var(--rv-mute); line-height: 1.4; }
.doc-qr .cap { font-size: 9.5px; color: var(--rv-mute); margin-top: 6px; line-height: 1.35; }

.doc-banner {
	display: flex; align-items: center; justify-content: space-between;
	background: var(--rv-brand); color: #fff; padding: 13px 18px; border-radius: 4px;
}
.rv-host.size-a5 .doc-banner { padding: 9px 13px; }
.doc-banner .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; opacity: .85; }
.doc-banner .val { font-size: 27px; font-weight: 800; font-variant-numeric: tabular-nums; }
.rv-host.size-a5 .doc-banner .val { font-size: 20px; }

.doc-band {
	background: var(--rv-brand); color: #fff; font-size: 11px; font-weight: 800;
	text-transform: uppercase; letter-spacing: .08em; padding: 5px 12px;
}
.rv-host.size-a5 .doc-band { font-size: 9.5px; padding: 4px 9px; }

table.doc-parties { width: 100%; border-collapse: collapse; }
table.doc-parties > tbody > tr > td { width: 50%; padding: 11px 14px; vertical-align: top; border-right: 1px solid var(--rv-line-soft); }
table.doc-parties > tbody > tr > td:last-child { border-right: none; }
table.doc-parties .p-head { font-size: 12px; font-weight: 800; color: var(--rv-brand-dark); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .05em; }
.rv-host.size-a5 .doc-parties .p-head { font-size: 10.5px; }
table.doc-parties .p-addr { font-size: 11.5px; color: var(--rv-soft); margin-bottom: 6px; }
.rv-host.size-a5 table.doc-parties .p-addr { font-size: 10px; }
table.doc-fields { width: 100%; border-collapse: collapse; font-size: 11.5px; }
.rv-host.size-a5 table.doc-fields { font-size: 10px; }
table.doc-fields td { padding: 3px 0; border-bottom: 1px dotted var(--rv-line-soft); }
table.doc-fields tr:last-child td { border-bottom: none; }
table.doc-fields .k { color: var(--rv-mute); width: 46%; }
table.doc-fields .v { font-weight: 700; text-align: right; word-break: break-word; }

table.doc-items { width: 100%; border-collapse: collapse; font-size: 12px; }
.rv-host.size-a5 table.doc-items { font-size: 10.5px; }
table.doc-items th {
	padding: 8px 9px; font-size: 9.5px; text-transform: uppercase; letter-spacing: .04em;
	color: #fff; background: var(--rv-brand); text-align: left; border-right: 1px solid rgba(255, 255, 255, .2);
}
table.doc-items th:last-child { border-right: none; }
table.doc-items td { padding: 7px 9px; border-bottom: 1px solid var(--rv-line-soft); border-right: 1px solid var(--rv-line-soft); }
table.doc-items td:last-child { border-right: none; }
table.doc-items .n { width: 34px; text-align: center; color: var(--rv-mute); }
table.doc-items .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.doc-items .desc { font-weight: 600; }
table.doc-items tr.sub td { padding: 0 9px 5px 34px; border-bottom: 1px solid var(--rv-line-soft); font-size: 10px; color: var(--rv-mute); font-family: "Consolas", "Courier New", monospace; }
table.doc-items tfoot td { padding: 0; border: none; }

.doc-sum { display: flex; gap: 16px; padding: 13px 16px; align-items: flex-start; }
.rv-host.size-a5 .doc-sum { gap: 11px; padding: 9px 11px; }
.doc-words { flex: 1; font-size: 11.5px; }
.rv-host.size-a5 .doc-words { font-size: 10px; }
.doc-words .w-lbl { font-size: 9.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--rv-mute); font-weight: 800; }
.doc-words .w-val { font-weight: 700; margin-top: 3px; font-style: italic; }
.doc-words .w-note { font-size: 10px; color: var(--rv-mute); margin-top: 5px; line-height: 1.4; }
table.doc-totals { width: 350px; border-collapse: collapse; font-size: 12px; }
.rv-host.size-a5 table.doc-totals { width: 265px; font-size: 10.5px; }
table.doc-totals td { padding: 5px 11px; border-bottom: 1px solid var(--rv-line-soft); }
table.doc-totals .k { color: var(--rv-soft); }
table.doc-totals .v { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.doc-totals tr.grand td {
	font-size: 14px; font-weight: 800; color: var(--rv-brand-dark);
	border-top: 2px solid var(--rv-brand); border-bottom: 2px solid var(--rv-brand); padding-top: 8px; padding-bottom: 8px;
}
table.doc-totals tr.grand .v { font-size: 16px; }
table.doc-totals tr.wht td { background: var(--rv-gold-tint); color: var(--rv-warn-ink); font-weight: 700; }
table.doc-totals tr.net td { background: var(--rv-brand-tint); }
table.doc-totals tr.net td { font-size: 13px; font-weight: 800; color: var(--rv-brand-dark); }
.rv-host.size-a5 table.doc-totals tr.net td { font-size: 11.5px; }

.doc-wht-note {
	margin: 0 16px 13px; padding: 8px 12px; font-size: 11px;
	background: var(--rv-gold-tint); border: 1px solid #fde68a; border-left: 3px solid var(--rv-gold);
	color: var(--rv-warn-ink); line-height: 1.5;
}
.rv-host.size-a5 .doc-wht-note { font-size: 9.5px; margin: 0 11px 9px; }

.doc-cov { padding: 11px 16px; }
.rv-host.size-a5 .doc-cov { padding: 8px 11px; }
table.doc-cov-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
.rv-host.size-a5 table.doc-cov-table { font-size: 10px; }
table.doc-cov-table th {
	padding: 6px 9px; font-size: 9.5px; text-transform: uppercase; letter-spacing: .05em;
	color: var(--rv-mute); background: #f8fafc; border-bottom: 2px solid var(--rv-brand); text-align: left;
}
table.doc-cov-table td { padding: 6px 9px; border-bottom: 1px solid var(--rv-line-soft); }
table.doc-cov-table .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.doc-pill { display: inline-block; padding: 2px 8px; border-radius: 9px; font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }
.doc-pill.full { background: var(--rv-ok-bg); color: var(--rv-ok-ink); }
.doc-pill.partial { background: var(--rv-warn-bg); color: var(--rv-warn-ink); }

table.doc-sign { width: 100%; border-collapse: separate; border-spacing: 22px 0; }
.rv-host.size-a5 table.doc-sign { border-spacing: 12px 0; }
table.doc-sign td { width: 33.33%; text-align: center; font-size: 11.5px; padding-top: 6px; }
.rv-host.size-a5 table.doc-sign td { font-size: 10px; }
.doc-sign .s-line { border-top: 1px solid var(--rv-ink); margin-bottom: 4px; height: 30px; }
.rv-host.size-a5 .doc-sign .s-line { height: 22px; }
.doc-sign .s-role { font-weight: 800; color: var(--rv-brand-dark); text-transform: uppercase; letter-spacing: .05em; font-size: 10px; }
.doc-sign .s-name { font-weight: 700; }
.doc-sign .s-cap { font-size: 9.5px; color: var(--rv-mute); }

.doc-legal {
	margin-top: 10px; border-top: 2px solid var(--rv-brand); padding: 10px 16px 4px;
	font-size: 10.5px; color: var(--rv-soft); line-height: 1.6;
}
.rv-host.size-a5 .doc-legal { font-size: 9px; padding: 8px 11px 3px; }
.doc-legal .lv { font-weight: 800; color: var(--rv-brand-dark); }
.doc-legal a { color: var(--rv-brand); font-family: "Consolas", "Courier New", monospace; word-break: break-all; text-decoration: none; }
.doc-legal .lfoot { margin-top: 5px; font-size: 9.5px; color: var(--rv-mute); }

.thermal {
	font-family: "Consolas", "Courier New", "DejaVu Sans Mono", monospace;
	font-size: 11px; line-height: 1.32; color: #000; background: #fff;
	text-align: center; overflow-wrap: break-word; word-break: break-word;
}
.rv-host.size-58 .thermal { font-size: 9px; line-height: 1.28; }

.thermal .t-center { text-align: center; }
.th-name { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; }
.rv-host.size-58 .th-name { font-size: 10.5px; }
.th-line { font-size: 10px; text-transform: uppercase; }
.rv-host.size-58 .th-line { font-size: 8.5px; }
.th-tel { font-size: 10px; font-weight: 700; }
.rv-host.size-58 .th-tel { font-size: 8.5px; }
.th-rule { border-top: 1px dashed #000; margin: 3px 0; }
.th-fiscal { font-size: 11px; font-weight: 700; text-transform: uppercase; line-height: 1.25; }
.rv-host.size-58 .th-fiscal { font-size: 9px; }
.th-saletype { font-size: 10px; font-weight: 700; }
.rv-host.size-58 .th-saletype { font-size: 8.5px; }
.th-status { font-size: 10px; font-weight: 700; padding: 1px 0; }
.rv-host.size-58 .th-status { font-size: 8.5px; }
td.doc-fiscal-info {
  display: flex;
  justify-content: center;
  align-items: center;
}

.doc-fiscal-inner {
  padding: 5% 10%; ;
  text-align: left;
  width: max-content;
  border: 1px dashed #000;
}
.doc-fiscal-tags{
  font-size: 18px;
  font-weight: 700;
 
}


table.thermal-meta { width: 100%; border-collapse: collapse; font-size: 10px; text-align: left; }
.rv-host.size-58 table.thermal-meta { font-size: 8.5px; }
table.thermal-meta td { padding: 1px 0; }
table.thermal-meta .k { text-transform: uppercase; font-weight: 700; white-space: nowrap; padding-right: 5px; }
table.thermal-meta .v { text-align: right; word-break: break-all; }

table.thermal-items { width: 100%; border-collapse: collapse; font-size: 10px; }
.rv-host.size-58 table.thermal-items { font-size: 8.5px; }
table.thermal-items th { padding: 2px 0; border-bottom: 1px solid #000; font-size: 9px; text-transform: uppercase; text-align: left; font-weight: 700; }
.rv-host.size-58 table.thermal-items th { font-size: 7.5px; }
table.thermal-items td { padding: 2px 0; vertical-align: top; }
table.thermal-items th.num, table.thermal-items td.num { text-align: right; white-space: nowrap; }
table.thermal-items .th-desc { text-align: left; white-space: normal; word-break: break-word; overflow-wrap: break-word; }
table.thermal-items .th-trunc { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
table.thermal-items .th-sku { display: block; font-size: 8.5px; color: #444; }
.rv-host.size-58 table.thermal-items .th-sku { font-size: 7px; }

table.thermal-totals { width: 100%; border-collapse: collapse; font-size: 10px; }
.rv-host.size-58 table.thermal-totals { font-size: 8.5px; }
table.thermal-totals td { padding: 1px 0; }
table.thermal-totals .k { text-transform: uppercase; font-weight: 700; white-space: nowrap; }
table.thermal-totals .v { text-align: right; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
table.thermal-totals tr.th-grand td { font-size: 12px; font-weight: 800; padding-top: 3px; padding-bottom: 3px; border-top: 1px solid #000; border-bottom: 1px solid #000; }
.rv-host.size-58 table.thermal-totals tr.th-grand td { font-size: 10px; }
.th-words { font-size: 9px; font-style: italic; text-align: center; margin-top: 3px; }
.rv-host.size-58 .th-words { font-size: 7.5px; }
.th-qr { margin: 5px 0 4px; text-align: center; }
.th-qr .frame { padding: 5px; border: 1px solid #000; border-radius: 0; }
.th-qr img { display: block; width: 190px; height: 190px; image-rendering: auto; }
.rv-host.size-58 .th-qr img { width: 130px; height: 130px; }
.th-qr-cap { font-size: 9px; font-weight: 700; text-transform: uppercase; margin-top: 3px; }
.rv-host.size-58 .th-qr-cap { font-size: 7.5px; }
.th-foot { font-size: 10px; text-transform: uppercase; font-weight: 700; }
.rv-host.size-58 .th-foot { font-size: 8.5px; }
.th-sku-plain { font-size: 9.5px; text-align: center; word-break: break-all; }
.rv-host.size-58 .th-sku-plain { font-size: 8px; }
.all_document{
  border: 0.5px dashed #000;
}
/* ════════════ PRINT ════════════ */
@media print {
	body { background: #fff; }
	.rv-toolbar { display: none !important; }
	.rv-wrap { max-width: none; padding: 0; }
	.receipt { box-shadow: none !important; max-width: 100% !important; padding: 0 !important; }
	.doc-party-cell { border-right: 1px solid var(--rv-line) !important; }
	.doc-avoid { break-inside: avoid; page-break-inside: avoid; }
	table.doc-items thead { display: table-header-group; }
	.tr-break { break-before: page; page-break-before: always; }
}
</style>
{% endblock %}

{% block page_content %}
<div class="rv-wrap">

<div class="rv-toolbar" id="rv-toolbar">
	<div class="rv-bar">
		<span class="rv-bar-title">Print &amp; Paper Setup</span>

		<div class="rv-sizes" id="rv-size-table">
			<button type="button" class="rv-size-row active" data-size="a4" onclick="selectSize('a4', this)" title="Laser / Inkjet"><b>A4</b><small>210×297 mm</small></button>
			<button type="button" class="rv-size-row" data-size="a5" onclick="selectSize('a5', this)" title="Laser / Inkjet"><b>A5</b><small>148×210 mm</small></button>
			<button type="button" class="rv-size-row" data-size="letter" onclick="selectSize('letter', this)" title="Laser / Inkjet"><b>Letter</b><small>8.5×11 in</small></button>
			<button type="button" class="rv-size-row" data-size="80" onclick="selectSize('80', this)" title="POS Thermal"><b>80mm</b><small>POS Thermal</small></button>
			<button type="button" class="rv-size-row" data-size="58" onclick="selectSize('58', this)" title="Portable Thermal"><b>58mm</b><small>Portable</small></button>
		</div>

{% block script %}
<script>
/* ══════════════════════════════════════════════════════════════
   ETHIOPIAN FISCAL TAX INVOICE RECEIPT — DUAL RENDERING ENGINE
   Cash Sales VAT/EXCISE TAX Invoice · Directive No. 1142/2026
   Document mode : A4 · A5 · Letter
   Thermal mode  : 80mm · 58mm
   ══════════════════════════════════════════════════════════════ */

var RV_SIZES = {
	a4:     { mode: "document", label: "A4 (210 × 297 mm)",      css: "@page { size: 210mm 297mm; margin: 12mm; }" },
	a5:     { mode: "document", label: "A5 (148 × 210 mm)",      css: "@page { size: 148mm 210mm; margin: 10mm; }" },
	letter: { mode: "document", label: "Letter (8.5 × 11 in)",   css: "@page { size: 8.5in 11in; margin: 12mm; }" },
	"80":   { mode: "thermal",  label: "80mm POS Thermal",       css: "@page { size: 80mm auto; margin: 0; }" },
	"58":   { mode: "thermal",  label: "58mm Portable Thermal",  css: "@page { size: 58mm auto; margin: 0; }" }
};

var THERMAL_SIZES = ["80", "58"];
var LOGO_URL = "/assets/ethiotel_pos/images/tele.jpg";
var RV_DATA = null;

/* ─────────── helpers ─────────── */
function esc(v) {
	if (v === null || v === undefined) { return ""; }
	return String(v).replace(/[&<>"']/g, function (c) {
		return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
	});
}

function num(v) {
	var n = parseFloat(v);
	return isNaN(n) ? 0 : n;
}

function money(v) {
	var n = num(v);
	return n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function qty(v) {
	var n = num(v);
	return (Math.round(n * 100000) / 100000).toString();
}

function thNum(v) {
	/* Thermal fiscal format: asterisk-prefixed figures */
	return "*" + money(v);
}

function pad(str, len) {
	str = String(str === null || str === undefined ? "" : str);
	while (str.length < len) { str += " "; }
	return str;
}

function firstOf(arr) {
	for (var i = 0; i < arr.length; i++) {
		if (arr[i] !== null && arr[i] !== undefined && arr[i] !== "") { return arr[i]; }
	}
	return "";
}

/* ─────────── moneyInWords (pure JS) ─────────── */
var RV_ONES = [
	"Zero", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine", "Ten",
	"Eleven", "Twelve", "Thirteen", "Fourteen", "Fifteen", "Sixteen", "Seventeen", "Eighteen", "Nineteen"
];
var RV_TENS = ["", "", "Twenty", "Thirty", "Forty", "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"];
var RV_SCALES = ["", "Thousand", "Million", "Billion", "Trillion"];

function chunkToWords(n) {
	var words = [];
	if (n === 0) { return "Zero"; }
	if (n < 20) { return RV_ONES[n]; }
	if (n < 100) {
		var t = RV_TENS[Math.floor(n / 10)];
		var o = n % 10;
		return o ? t + " " + RV_ONES[o] : t;
	}
	if (n < 1000) {
		var h = RV_ONES[Math.floor(n / 100)];
		var rest = n % 100;
		return rest ? h + " Hundred " + chunkToWords(rest) : h + " Hundred";
	}
	return String(n);
}

function moneyInWords(amount, currency) {
	var value = num(amount);
	var sign = value < 0 ? "Minus " : "";
	var abs = Math.abs(value);

	var whole = Math.floor(abs + 1e-9);
	var cents = Math.round((abs - whole) * 100);
	if (cents === 100) { whole += 1; cents = 0; }

	var parts = [];
	var n = whole;
	var i = 0;
	while (n > 0) {
		var g = n % 1000;
		if (g) {
			var w = chunkToWords(g);
			if (RV_SCALES[i]) { w += " " + RV_SCALES[i]; }
			parts.push(w);
		}
		n = Math.floor(n / 1000);
		i++;
	}

	var out = sign + (parts.reverse().join(" ") || "Zero");

	out += " " + (currency ? String(currency) : "Birr");

	out += cents ? " and " + chunkToWords(cents) + " Cents" : " Only";

	return out.replace(/\s+/g, " ").trim();
}

/* ─────────── derived fiscal values ─────────── */
var RV_CURRENCY_NAMES = { ETB: "Birr", USD: "US Dollars", EUR: "Euro" };

function currencyInWords(code) {
	var key = String(code || "ETB").toUpperCase();
	return RV_CURRENCY_NAMES[key] || key;
}

function fiscalModel(d) {
	var t = d.totals || {};
	var net = num(t.net_total);
	var discount = num(t.discount);
	var vat = num(t.tax_total);
	var grand = num(t.grand_total);
	var paid = num(t.paid_amount);
	var withheld = num(d.withheld_amount);
	var collectible = num(d.collectible_amount) || Math.max(grand - withheld, 0);
	var outstanding = num(t.outstanding_amount) || Math.max(grand - paid, 0);
	var netPayable = Math.max(grand - paid, 0);

	var cov = d.coverage || [];
	var collectibleRemaining = cov.length
		? cov.reduce(function (s, r) { return s + num(r.collectible_remaining_amount); }, 0)
		: Math.max(collectible - paid, 0);

	var itemCount = 0;
	var totalQty = 0;
	(d.items || []).forEach(function (it) {
		itemCount += 1;
		totalQty += num(it.quantity);
	});

	return {
		net: net,
		discount: discount,
		subtotal: net,
		vat: vat,
		grand: grand,
		paid: paid,
		withheld: withheld,
		collectible: collectible,
		outstanding: outstanding,
		netPayable: netPayable,
		collectibleRemaining: collectibleRemaining,
		itemCount: itemCount,
		totalQty: totalQty,
		change: Math.max(paid - collectible, 0),
		currency: d.currency || "ETB",
		words: moneyInWords(collectible || grand, currencyInWords(d.currency || "ETB"))
	};
}

function statusOf(d) {
	if (d.verified || d.status === "Registered" || d.status === "Active") {
		return { text: "Registered / Authentic", cls: "ok" };
	}
	if (d.cancelled || d.status === "Cancelled") {
		return { text: "Cancelled", cls: "warn" };
	}
	return { text: firstOf([d.status, "Not Registered"]), cls: "bad" };
}

/* ─────────── shared fragments ─────────── */
function logoImg(extraClass) {
	return '<img src="' + esc(LOGO_URL) + '" alt="' + esc(firstOf([(d_safe_logo_name()), "Organization Logo"])) + '"'
		+ ' class="' + (extraClass || "") + '"'
		+ ' onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';" />'
		+ '<span style="display:none;width:84px;height:72px;align-items:center;justify-content:center;'
		+ 'border:1px dashed #cbd5e1;border-radius:4px;font-weight:800;color:#0f766e;font-size:18px;">'
		+ esc(initials(d_safe_seller())) + '</span>';
}

function d_safe_seller() { return (RV_DATA && RV_DATA.seller) || {}; }
function d_safe_logo_name() { return d_safe_seller().legal_name || ""; }

function initials(o) {
	var src = firstOf([o.trade_name, o.legal_name]) || "ET";
	var parts = String(src).split(/[\s,]+/).filter(Boolean);
	if (parts.length === 1) { return parts[0].slice(0, 2).toUpperCase(); }
	return (parts[0].charAt(0) + parts[1].charAt(0)).toUpperCase();
}

/* If the stored QR image cannot load, keep the frame so the receipt still
   shows a placeholder instead of a silently blank cell. */
function rvQrFallback(img) {
	var frame = img && img.parentNode;
	if (!frame) { return; }
	frame.innerHTML = '<span style="display:block;padding:18px 4px;font-size:9px;line-height:1.4;'
		+ 'color:#94a3b8;font-family:inherit;">QR image unavailable</span>';
}

/* Sized so the printed code keeps at least a 4-module quiet zone and stays
   scannable at POS terminal distance. */
function qrBlock(d, caption) {
	if (!d.qr_code_url) { return ""; }
	return '<div class="frame"><img src="' + esc(d.qr_code_url) + '" alt="Fiscal verification QR code"'
		+ ' onerror="rvQrFallback(this);" /></div>'
		+ (caption ? '<div class="cap">' + caption + '</div>' : "");
}

function fieldRows(rows) {
	var out = "";
	rows.forEach(function (r) {
		out += '<tr><td class="k">' + esc(r[0]) + '</td><td class="v">' + esc(r[1]) + '</td></tr>';
	});
	return out;
}

function addressLines(o) {
	var parts = [];
	var locality = firstOf([o.locality, o.kebele]);
	var subCity = firstOf([o.sub_city, o.zone]);
	var house = firstOf([o.house_number]);
	if (house) { parts.push("House No. " + house); }
	if (locality) { parts.push(locality); }
	if (subCity) { parts.push("Sub City: " + subCity); }
	if (o.woreda) { parts.push("Woreda: " + o.woreda); }
	if (o.city) { parts.push("City: " + o.city); }
	if (o.region) { parts.push(o.region); }
	if (o.country) { parts.push(o.country); }
	return parts;
}

/* ══════════════════════════════════════════════════════════════
   DOCUMENT MODE  —  renderA4()
   ══════════════════════════════════════════════════════════════ */
function renderA4(d) {
	var m = fiscalModel(d);
	var st = statusOf(d);
	var s = d.seller || {};
	var b = d.buyer || {};
	var items = d.items || [];
	var cov = d.coverage || [];
	var cur = m.currency;

	var html = "";

	/* ── 1. Document header ── */
	html += '<div class="all_document"><div class="doc-avoid">';
	html += '<div style="display:flex;justify-content:flex-end;margin-bottom:8px;">'
		+ '<span class="doc-badge ' + st.cls + '">' + esc(st.text) + '</span></div>';

	html += '<table class="doc-head"><tr>';
	html += '<td class="doc-logo">' + logoImg() + '</td>';
	html += '<td>'
		+ '<div class="doc-org-title">' + esc(firstOf([s.trade_name, s.legal_name, "Ethio Telecom"])) + '</div>'
		+ '<div class="doc-org-sub">POWERED BY ETHIO TELECOM</div>'
		+ '<div class="doc-org-sub">' + esc(addressLines(s).join(", ") || firstOf([s.phone, s.email])) + '</div>'
		+ '<div class="doc-org-sub">ስልክ ቁጥር/ TEL: ' + esc(s.phone || "—")
		+ ' &nbsp;·&nbsp; ኢሜይል / Email: ' + esc(s.email || "—") + '</div>'
		+ '</td>';
	html += '<td style="width:300px;">';
	html += '<div class="doc-meta"><table>';
	html += '<tr><th>' + (d.is_receipt ? "የክፍያ ደረሰኝ ቁጥር / Receipt No." : "የደረሰኝ ቁጥር / Invoice No.") + '</th><td>'
		+ esc(firstOf([d.document_number, d.invoice_name])) + '</td></tr>';
	html += '<tr><th>ቀን / Date</th><td>' + esc(firstOf([d.document_date, d.receipt_date])) + '</td></tr>';
	html += '<tr><th>ሰአት / Time</th><td>' + esc(d.posting_time || "—") + '</td></tr>';
	if (d.receipt_type) { html += '<tr><th>የክፍያ አይነት / Type</th><td>' + esc(d.receipt_type) + '</td></tr>'; }
	html += '<tr><th>የክፍያ ዘዴ / Payment</th><td>' + esc(d.mode_of_payment || "CASH") + '</td></tr>';
	html += '</table></div></td>';
	html += '</tr></table></div>';

	/* ── 2. Fiscal subhead ── */
/* ── 2. Fiscal subhead ── */
	html += '<div class="doc-avoid"><table class="doc-fiscal"><tr>';
	html += '<td class="doc-fiscal-info">';
	// ── ADDED: This wrapper div handles the centering ──
	html += '<div class="doc-fiscal-inner">';
	html += '<div class="doc-fiscal-title">እጅ በእጅ የሽያጭ ደረሰኝ-ተ.እ.ታ/ኤክሳይዝ ታክስ ኢንቮይስ'
		+ '<small>Cash Sales VAT/EXCISE TAX Invoice</small></div>';
	html += '<div class="doc-fiscal-tags">';
	html += '<span class="doc-tag">የሽያጭ አይነት / Sale Type: ' + esc(firstOf([d.sale_type, "B2C"])) + '</span>';
	if (d.is_receipt) { html += '<span class="doc-tag gold">' + esc(d.receipt_type || "Sales Receipts") + '</span>'; }
	html += '<span class="doc-tag dark">ተ.እ.ታ / VAT 15%</span>';
	html += '</div>';
	html += '<div class="doc-irn"><b>IRN / የሰነድ መዝገብ ቁጥር:</b> ' + esc(firstOf([d.irn, "N/A"])) + '</div>';
	html += '<div class="doc-irn"><b>System Number / የሲስተም ቁጥር:</b> ' + esc(firstOf([d.system_number, "N/A"])) + '</div>';
	// ── ADDED: Close the wrapper div ──
	html += '</div>';
	html += '</td>';
	html += '<td class="doc-qr">';
	if (d.qr_code_url) {
		html += qrBlock(d, "Scan to verify against MoR<br />ለማረጋገጫ ይቃኑ");
	} else {
		html += '<div class="frame rv-qr-none">QR not available</div>';
	}
	html += '</td></tr></table></div>';


	/* ── 3. Total banner ── */
	html += '<div class="doc-banner doc-avoid" style="margin-top:12px;">'
		+ '<span class="lbl">ጠቅላላ ድምር / Grand Total (incl. Tax)</span>'
		+ '<span class="val">' + esc(money(m.grand)) + ' ' + esc(cur) + '</span>'
		+ '</div>';

	/* ── 4. Parties grid ── */
	html += '<div style="margin-top:14px;"><div class="doc-band">ከ/ወደ / From &amp; To</div>';
	html += '<table class="doc-parties"><tr>';
	html += '<td class="doc-party-cell">';
	html += '<div class="p-head">ከ / From — ሻጭ (Seller)</div>';
	html += '<div class="p-addr">' + esc(addressLines(s).join(", ") || "—") + '</div>';
	html += '<table class="doc-fields">' + fieldRows([
		["የሻጭ ህጋዊ ስም / Legal Name", s.legal_name],
		["የግብይት ስም / Trade Name", s.trade_name],
		["የስልክ ቁጥር / Phone", s.phone],
		["ኢሜይል / Email", s.email],
		["TIN / ታክስ መለያ ቁጥር", s.tin],
		["VAT Reg. No. / ታክስ ምዝገባ ቁጥር", s.vat_number]
	]) + '</table></td>';

	html += '<td class="doc-party-cell">';
	html += '<div class="p-head">ወደ / To — ገዢ (Buyer)</div>';
	html += '<div class="p-addr">' + esc(addressLines(b).join(", ") || "—") + '</div>';
	html += '<table class="doc-fields">' + fieldRows([
		["የገዥ ህጋዊ ስም / Legal Name", b.legal_name],
		["የስልክ ቁጥር / Phone", b.phone],
		["ኢሜይል / Email", b.email],
		["TIN / ታክስ መለያ ቁጥር", b.tin_number],
		["VAT Reg. No. / ታክስ ምዝገባ ቁጥር", b.tin_number],
		["የመታወቂያ አይነት / ID Type", b.id_type],
		["የመታወቂያ ቁጥር / ID No.", b.id_number]
	]) + '</table></td>';
	html += '</tr></table></div>';

	/* ── 5. Bilingual items table ── */
	html += '<div style="margin-top:14px;"><div class="doc-band">የዕቃው ዝርዝር / Items</div>';
	html += '<table class="doc-items"><thead><tr>';
	html += '<th class="n">ተ.ቁ / No.</th>';
	html += '<th>የዕቃው አይነት / Description</th>';
	html += '<th>መለኪያ / UoM</th>';
	html += '<th class="num">ብዛት / Qty</th>';
	html += '<th class="num">የአንዱ ዋጋ / Unit Price</th>';
	html += '<th>ታክስ ኮድ / Tax Code</th>';
	html += '<th class="num">ቅናሽ / Disc.</th>';
	html += '<th class="num">ጠቅላላ ዋጋ / Total Amount</th>';
	html += '</tr></thead><tbody>';
	if (items.length) {
		items.forEach(function (it, i) {
			html += '<tr>';
			html += '<td class="n">' + (i + 1) + '</td>';
			html += '<td class="desc">' + esc(firstOf([it.description, it.item_code, "—"])) + '</td>';
			html += '<td>' + esc(it.uom || "—") + '</td>';
			html += '<td class="num">' + esc(qty(it.quantity)) + '</td>';
			html += '<td class="num">' + esc(money(it.rate)) + '</td>';
			html += '<td>' + esc(firstOf([it.tax_code, "—"])) + '</td>';
			html += '<td class="num">' + esc(num(it.discount_amount) ? money(it.discount_amount) : "—") + '</td>';
			html += '<td class="num">' + esc(money(it.amount)) + '</td>';
			html += '</tr>';
			if (it.item_code) {
				html += '<tr class="sub"><td></td><td colspan="7">SKU / Item Code: ' + esc(it.item_code) + '</td></tr>';
			}
		});
	} else {
		html += '<tr><td class="n">—</td><td colspan="7" style="color:#94a3b8;">No item lines on this document.</td></tr>';
	}
	html += '</tbody></table></div>';

	/* ── 6. Totals & financial summary ── */
	html += '<div style="margin-top:14px;"><div class="doc-band">የክፍያ ማጠቃለያ / Financial Summary</div>';
	html += '<div class="doc-sum">';
	html += '<div class="doc-words">';
	html += '<div class="w-lbl">በቃላት የተጻፈ መጠን / Amount in Words</div>';
	html += '<div class="w-val">' + esc(m.words) + '</div>';
	html += '<div class="w-note">አጠቃላይ ክፍያ ማብራሪያ። Total computed from item lines above. '
		+ 'Tax withheld by the buyer, where applicable, is shown separately below and is not part of the net payable.</div>';
	html += '</div>';

	html += '<table class="doc-totals"><tbody>';
	html += '<tr><td class="k">የተጣራ ድምር / Net Total</td><td class="v">' + esc(money(m.net)) + '</td></tr>';
	html += '<tr><td class="k">ቅናሽ / Discount Amount</td><td class="v">' + esc(money(m.discount)) + '</td></tr>';
	html += '<tr><td class="k">ታክስ (15%) / VAT</td><td class="v">' + esc(money(m.vat)) + '</td></tr>';
	html += '<tr class="grand"><td class="k">ጠቅላላ ድምር / Total incl. Tax</td><td class="v">' + esc(money(m.grand)) + '</td></tr>';
	if (m.withheld > 0) {
		html += '<tr class="wht"><td class="k">በገዢ የተያዘ ታክስ / Tax Withheld</td><td class="v">−' + esc(money(m.withheld)) + '</td></tr>';
		html += '<tr class="net"><td class="k">ጠቅላላ ተሰብሳቢ / Collectible</td><td class="v">' + esc(money(m.collectible)) + '</td></tr>';
	}
	html += '<tr><td class="k">የተከፈለ መጠን / Paid Amount</td><td class="v">' + esc(money(m.paid)) + '</td></tr>';
	html += '<tr><td class="k">ያልተከፈለ / Due</td><td class="v">' + esc(money(m.outstanding)) + '</td></tr>';
	html += '<tr class="net"><td class="k">ቀሪ የሚከፈል / Net Payable</td><td class="v">' + esc(money(m.netPayable)) + ' ' + esc(cur) + '</td></tr>';
	html += '</tbody></table>';
	html += '</div>';

	if (m.withheld > 0) {
		html += '<div class="doc-wht-note">የተያዘ ታክስ ማስታወሻ / Tax Withholding Notice: '
			+ 'A withholding of <strong>' + esc(money(m.withheld)) + ' ' + esc(cur) + '</strong> was deducted from the '
			+ 'registered total of ' + esc(money(m.grand)) + ' ' + esc(cur) + '. The net amount collectible by the seller is '
			+ '<strong>' + esc(money(m.collectible)) + ' ' + esc(cur) + '</strong>. The withheld tax is remitted by the buyer '
			+ 'to the tax authority as required under Directive No. 1142/2026.</div>';
	}
	html += '</div>';

	/* ── Coverage (payment settlement detail) ── */
	if (cov.length) {
		html += '<div style="margin-top:14px;"><div class="doc-band">የክፍያ ሽፋን / Payment Coverage</div>';
		html += '<div class="doc-cov"><table class="doc-cov-table"><thead><tr>';
		html += '<th>የደረሰኝ ቁጥር / Invoice</th>';
		html += '<th>ሁኔታ / Status</th>';
		html += '<th class="num">የተመዘገበ / Registered</th>';
		html += '<th class="num">የዚህ ክፍያ / This Receipt</th>';
		html += '<th class="num">ያልተከፈለ ወይም ከዚ በፊት የተከፈለ / Paid / Remaining</th>';
		html += '</tr></thead><tbody>';
		cov.forEach(function (r) {
			var full = String(firstOf([r.collectible_coverage, r.payment_coverage])).toUpperCase() === "FULL";
			html += '<tr><td>' + esc(firstOf([r.invoice, "—"])) + '</td>';
			html += '<td><span class="doc-pill ' + (full ? "full" : "partial") + '">' + (full ? "Full" : "Partial") + '</span></td>';
			html += '<td class="num">' + esc(money(r.total_amount)) + '</td>';
			html += '<td class="num">' + esc(money(firstOf([r.receipt_paid_amount, r.mor_collected_amount]))) + '</td>';
			html += '<td class="num">' + esc(money(firstOf([r.collectible_remaining_amount, r.remaining_amount]))) + ' <span style="font-size: 0.85em; color: var(--rv-soft);">(' + (full ? "Paid" : "Remaining") + ')</span></td>';
			html += '</tr>';
		});
		html += '</tbody></table></div></div>';
	}

	/* ── 7. Signatures & legal footer ── */
	html += '<div class="doc-avoid" style="margin-top:16px;">';
	html += '<table class="doc-sign"><tr>';
	html += '<td><div class="s-line"></div><div class="s-role">የክፍያ ዘዴ / Mode of Payment</div>'
		+ '<div class="s-name">' + esc(d.mode_of_payment || "CASH") + '</div>'
		+ '<div class="s-cap">' + esc(m.currency) + ' ' + esc(money(m.paid)) + '</div></td>';
	html += '<td><div class="s-line"></div><div class="s-role">የሻጭ ስም እና ፊርማ / Seller Name &amp; Signature</div>'
		+ '<div class="s-name">' + esc(firstOf([d.seller && d.seller.trade_name, d.seller && d.seller.legal_name, "—"])) + '</div>'
		+ '<div class="s-cap">TIN ' + esc(firstOf([d.seller && d.seller.tin, "—"])) + '</div></td>';
	html += '<td><div class="s-line"></div><div class="s-role">የተቀበለው ስም እና ፊርማ / Receiver Name &amp; Signature</div>'
		+ '<div class="s-name">' + esc(firstOf([d.cashier, d.buyer && d.buyer.legal_name, "—"])) + '</div>'
		+ '<div class="s-cap">ካሽየር / Cashier</div></td>';
	html += '</tr></table></div>';

	html += '<div class="doc-legal">';
	html += '<span class="lv">ስለ ህግ ተገዥነት / Statutory Notice:</span> ';
	html += 'This is a computer-generated fiscal document issued under Ministry of Revenue Directive No. 1142/2026. '
		+ 'It is valid only when the IRN shown above matches the record held by the Ministry of Revenue and the QR '
		+ 'verification returns <em>Registered / Authentic</em>. Any alteration voids this receipt. '
		+ 'ይህ በገቢዎች ሚኒስቴር የታክስ መመሪያ ቁጥር 1142/2026 ስር የተዘጋጀ በኮምፒዩተር የተሰራ የሽያጭ ደረሰኝ ነው።';
	html += '<div class="lfoot">ማረጋገጫ / Verify: '
		+ '<a href="' + esc(verificationLink(d)) + '">' + esc(verificationLink(d)) + '</a></div>';
	html += '<div class="lfoot">This receipt was generated electronically by ' + esc(d.seller && d.seller.legal_name || "Ethio Telecom")
		+ ' · System Number ' + esc(firstOf([d.system_number, "N/A"]))
		+ ' · ' + esc(firstOf([d.document_date, d.receipt_date])) + ' ' + esc(d.posting_time || "") + '</div>';
	html += '</div>';

	html += '</div></div>'; /* /doc */
	return html;
}

function verificationLink(d) {
	var irn = firstOf([d.irn, d.document_number]);
	return window.location.origin + "/invoice_receipt?irn=" + encodeURIComponent(irn);
}

/* ══════════════════════════════════════════════════════════════
   THERMAL TICKER MODE  —  renderThermal()
   ══════════════════════════════════════════════════════════════ */
function renderThermal(d) {
	var m = fiscalModel(d);
	var st = statusOf(d);
	var s = d.seller || {};
	var b = d.buyer || {};
	var items = d.items || [];
	var cur = m.currency;
	var addr = addressLines(s);

	var html = "";

	/* ── 1. Compact fiscal header ── */
	html += '<div class="th-center">';
	html += '<div class="th-line">' + esc(firstOf([s.tin, "TIN: N/A"])) + '</div>';
	html += '<div class="th-name">' + esc(String(firstOf([s.trade_name, s.legal_name, "ETHIO TELECOM"])).toUpperCase()) + '</div>';
	if (addr[0]) { html += '<div class="th-line">' + esc(addr[0]) + '</div>'; }
	if (addr[1]) { html += '<div class="th-line">' + esc(addr[1]) + '</div>'; }
	if (addr[2]) { html += '<div class="th-line">' + esc(addr[2]) + '</div>'; }
	if (addr[3]) { html += '<div class="th-line">' + esc(addr[3]) + '</div>'; }
	if (s.phone) { html += '<div class="th-tel">TEL: ' + esc(s.phone) + '</div>'; }
	html += '<div class="th-rule"></div>';
	html += '<div class="th-fiscal">' + esc(firstOf([d.document_number, d.invoice_name, "RECEIPT"])) + '</div>';
	html += '<div class="th-saletype">SALE TYPE: ' + esc(firstOf([d.sale_type, "B2C"])) + '</div>';
	html += '<div class="th-fiscal">CASH SALES VAT/EXCISE</div>';
	html += '<div class="th-fiscal">TAX INVOICE</div>';
	html += '<div class="th-rule"></div>';
	html += '<div class="th-status">' + esc(st.text) + '</div>';
	html += '<div class="th-rule"></div>';
	html += '</div>';

	/* ── 2. Compact meta block ── */
	html += '<table class="thermal-meta">';
	html += '<tr><td class="k">RCP NO:</td><td class="v">' + esc(firstOf([d.document_number, d.invoice_name, "—"])) + '</td></tr>';
	html += '<tr><td class="k">SYS NO:</td><td class="v">' + esc(firstOf([d.system_number, "—"])) + '</td></tr>';
	html += '<tr><td class="k">DATE:</td><td class="v">' + esc(firstOf([d.document_date, d.receipt_date, "—"])) + '</td></tr>';
	html += '<tr><td class="k">TIME:</td><td class="v">' + esc(d.posting_time || "—") + '</td></tr>';
	html += '<tr><td class="k">CUST:</td><td class="v">' + esc(firstOf([b.legal_name, "WALK-IN"])) + '</td></tr>';
	html += '<tr><td class="k">BUYER TIN:</td><td class="v">' + esc(firstOf([b.tin_number, "—"])) + '</td></tr>';
	html += '<tr><td class="k">PAY:</td><td class="v">' + esc(d.mode_of_payment || "CASH") + '</td></tr>';
	html += '</table>';
	html += '<div class="th-rule"></div>';

	/* ── 3. Thermal items grid ── */
	html += '<table class="thermal-items"><thead><tr>';
	html += '<th>DESCRIPTION</th><th class="num">DSC</th><th class="num">QTY</th><th class="num">PRICE</th>';
	html += '</tr></thead><tbody>';
	if (items.length) {
		items.forEach(function (it) {
			var label = firstOf([it.description, it.item_code, "—"]);
			html += '<tr>';
			html += '<td class="th-desc"><span class="th-trunc">' + esc(label) + '</span>'
				+ (it.item_code ? '<span class="th-sku">' + esc(it.item_code) + '</span>' : "") + '</td>';
			html += '<td class="num">' + (num(it.discount_amount) ? money(it.discount_amount) : "") + '</td>';
			html += '<td class="num">' + esc(qty(it.quantity)) + '</td>';
			html += '<td class="num">' + esc(money(it.rate)) + '</td>';
			html += '</tr>';
		});
	} else {
		html += '<tr><td class="th-desc">NO ITEMS</td><td class="num"></td><td class="num"></td><td class="num"></td></tr>';
	}
	html += '</tbody></table>';
	html += '<div class="th-rule"></div>';

	/* ── 4. Thermal totals (asterisk-prefixed) ── */
	html += '<table class="thermal-totals">';
	html += '<tr><td class="k">DSC</td><td class="v">' + thNum(m.discount) + '</td></tr>';
	html += '<tr><td class="k">TXBL1</td><td class="v">' + thNum(m.subtotal) + '</td></tr>';
	html += '<tr><td class="k">VAT (15%)</td><td class="v">' + thNum(m.vat) + '</td></tr>';
	if (m.withheld > 0) {
		html += '<tr><td class="k">WHTD TX</td><td class="v">' + thNum(m.withheld) + '</td></tr>';
	}
	html += '<tr class="th-grand"><td class="k">TOTAL</td><td class="v">' + thNum(m.grand) + '</td></tr>';
	html += '<tr><td class="k">CASH</td><td class="v">' + thNum(m.paid) + '</td></tr>';
	if (m.change > 0) {
		html += '<tr><td class="k">CHANGE</td><td class="v">' + thNum(m.change) + '</td></tr>';
	}
	if (m.outstanding > 0) {
		html += '<tr><td class="k">DUE</td><td class="v">' + thNum(m.outstanding) + '</td></tr>';
	}
	html += '</table>';
	html += '<div class="th-words">' + esc(m.words) + '</div>';

	if (m.withheld > 0) {
		html += '<div class="th-rule"></div>';
		html += '<div class="th-line">TAX WITHHELD: ' + esc(money(m.withheld)) + ' ' + esc(cur) + '</div>';
		html += '<div class="th-line">COLLECTIBLE: ' + esc(money(m.collectible)) + ' ' + esc(cur) + '</div>';
		html += '<div class="th-rule"></div>';
	}

	/* ── 5. Footer information ── */
	if (d.qr_code_url) {
		html += '<div class="th-rule"></div>';
		html += '<div class="th-qr">' + qrBlock(d) + '<div class="th-qr-cap">Scan to verify / በማረጋገጫ</div></div>';
		html += '<div class="th-rule"></div>';
	}

	html += '<div class="th-center">';
	html += '<div class="th-foot">ITEM #' + m.itemCount + '</div>';
	html += '<div class="th-line">QTY TOTAL: ' + esc(qty(m.totalQty)) + '</div>';
	html += '<div class="th-line">CASHIER: ' + esc(firstOf([d.cashier, "—"])) + '</div>';
	html += '<div class="th-line">SELLER TIN: ' + esc(firstOf([s.tin, "—"])) + '</div>';
	html += '<div class="th-rule"></div>';
	html += '<div class="th-sku-plain">' + esc(firstOf([d.irn, "IRN: N/A"])) + '</div>';
	html += '<div class="th-rule"></div>';
	html += '<div class="th-foot">THANK YOU FOR YOUR BUSINESS</div>';
	html += '<div class="th-line">እናመሰግናለን / THANK YOU</div>';
	html += '<div class="th-line">Directive No. 1142/2026</div>';
	html += '</div>';

	return html;
}

/* ══════════════════════════════════════════════════════════════
   MODE SWITCHING & PAPER CONTROL
   ══════════════════════════════════════════════════════════════ */
function currentSize() {
var row = document.querySelector("#rv-size-table .rv-size-row.active");
	if (row && RV_SIZES[row.getAttribute("data-size")]) {
		return row.getAttribute("data-size");
	}
	return "a4";
}

function isThermal(size) {
	return THERMAL_SIZES.indexOf(size) !== -1;
}

function currentMode() {
	return isThermal(currentSize()) ? "thermal" : "document";
}

function applyPageSizeCSS(size) {
	var cfg = RV_SIZES[size];
	if (!cfg) { return; }
	var tag = document.getElementById("page-size-css");
	if (!tag) {
		tag = document.createElement("style");
		tag.id = "page-size-css";
		document.head.appendChild(tag);
	}
	tag.innerHTML = cfg.css;
}

function renderCurrent() {
	var host = document.getElementById("rv-host");
	var target = document.getElementById("receipt");
	var size = currentSize();
	var d = RV_DATA || {};
	var mode = isThermal(size) ? "thermal" : "document";

	/* Keep only the active paper class, then flag the render mode. */
	host.className = host.className.replace(/\bsize-\S+/g, "").replace(/\bthermal-size\b/g, "").trim();
	host.className += " size-" + size;
	if (mode === "thermal") {
		host.className += " thermal-size";
	}

	var label = document.getElementById("rv-mode-label");
	if (label) {
		label.textContent = mode === "thermal"
			? "Thermal ticker mode · " + RV_SIZES[size].label
			: "Document mode · " + RV_SIZES[size].label;
	}

	target.innerHTML = mode === "thermal" ? renderThermal(d) : renderA4(d);
	target.setAttribute("data-mode", mode);
	target.setAttribute("data-size", size);
}

function selectSize(size, rowEl) {
	if (!RV_SIZES[size]) { return; }

	document.querySelectorAll("#rv-size-table .rv-size-row").forEach(function (r) {
	r.classList.remove("active");
});
	if (rowEl) { rowEl.classList.add("active"); }

	applyPageSizeCSS(size);
	renderCurrent();
}

function printReceipt() {
	window.print();
}

function downloadPDF() {
	/* The browser's print pipeline is the PDF writer; open it save-as-PDF. */
	window.print();
}

/* ══════════════════════════════════════════════════════════════
   BOOTSTRAP
   ══════════════════════════════════════════════════════════════ */
frappe.ready(function () {
	var params = new URLSearchParams(window.location.search);
	var irn = params.get("irn") || params.get("rrn") || "";
	var qrPayload = params.get("qr_payload") || "";
	var target = document.getElementById("receipt");

	applyPageSizeCSS(currentSize());

	if (!irn && !qrPayload) {
		target.innerHTML = '<div style="padding:40px;text-align:center;color:#94a3b8;font-size:13px;">'
			+ 'Provide an IRN or RRN in the URL (for example <code>?irn=&lt;reference&gt;</code>) to view this receipt.</div>';
		renderCurrent();
		return;
	}

	frappe.call({
		method: "ethiotel_pos.eims_verify_public.receipt_public",
		args: { irn: irn, rrn: irn, qr_payload: qrPayload },
		callback: function (r) {
			RV_DATA = r.message || {};
			renderCurrent();
		},
		error: function (r) {
			var msg = (r && (r.message || r.exc_type)) || "Receipt service unavailable.";
			target.innerHTML = '<div style="padding:40px;text-align:center;color:#b91c1c;font-size:13px;">'
				+ esc(msg) + '</div>';
		}
	});
});
</script>
